<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Park Plot Finder</title>
<meta name="description" content="Find any plot in Central Park Housing Scheme, Lahore, on the satellite map and step into 360° street view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map"></div>

<section id="panel" aria-label="Plot search">
  <div class="brand"><span class="brand-mark">Central Park</span><span class="brand-sub">Plot Finder</span></div>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search a plot, e.g. 6 B" aria-label="Search plot or block">
    <button id="clear" class="icon" hidden aria-label="Clear">&times;</button>
  </div>
  <div id="drawer" class="drawer">
    <div id="chips" class="chips" aria-label="Blocks"></div>
    <div id="summary" class="summary" aria-live="polite"></div>
    <div id="results" class="results" hidden></div>
  </div>
</section>

<aside id="card" class="card" hidden></aside>

<nav class="views" aria-label="Map view">
  <button data-view="sat" class="on">Satellite</button>
  <button data-view="plan">Master plan</button>
  <button data-view="focus">Focus</button>
</nav>

<div class="tools">
  <button id="home" class="tool" title="Back to the start view" aria-label="Back to the start view"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg></button>
  <button id="tilt" class="tool txt" title="Switch between 3D and flat view" aria-label="Switch between 3D and flat view">2D</button>
  <button id="callouts-btn" class="tool on" title="Show or hide landmark names" aria-label="Show or hide landmark names"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 4v2h12V8zm0 4v2h8v-2z"/></svg></button>
  <button id="layers-btn" class="tool" title="Layers" aria-label="Layers"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m12 2 10 6-10 6L2 8zm-8.6 9.6L12 17l8.6-5.4L22 13l-10 6-10-6z"/></svg></button>
  <div id="layers" class="layers">
    <label class="row slider">Plan opacity <input id="op" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <label class="row"><input id="t-roads" type="checkbox" checked> Main roads</label>
    <label class="row"><input id="t-pano" type="checkbox" checked> 360° view points</label>
    <label class="row"><input id="t-labels" type="checkbox"> Satellite road names</label>
    <label class="row"><input id="t-osm" type="checkbox"> Street map instead of satellite</label>
  </div>
</div>

<aside id="calib" class="calib" hidden></aside>

<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="viewer-title">
  <div class="viewer-bar"><button id="viewer-close" class="back-btn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>Back to plot finder</button><span id="viewer-title">360° view</span></div>
  <div id="viewer-body" class="viewer-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="js/georef.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
