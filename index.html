<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Park Plot Finder</title>
<meta name="description" content="Find any plot in Central Park Housing Scheme, Lahore, on the satellite map and step into 360° street view.">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map"></div>

<section id="panel" aria-label="Plot search">
  <div class="brand"><span class="logo">CP</span><div><b>Central Park</b><small>Plot Finder</small></div></div>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Plot 6 Block B, “6b”, “Block C”, “mosque”…" aria-label="Search plot or block">
    <button id="clear" class="icon" hidden aria-label="Clear">&times;</button>
  </div>
  <div id="chips" class="chips" aria-label="Blocks"></div>
  <div id="summary" class="summary" aria-live="polite"></div>
  <div id="results" class="results" hidden></div>
</section>

<aside id="card" class="card" hidden></aside>

<div class="tools">
  <button id="home" class="tool" title="Show whole scheme" aria-label="Show whole scheme"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg></button>
  <button id="layers-btn" class="tool" title="Layers" aria-label="Layers"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m12 2 10 6-10 6L2 8zm-8.6 9.6L12 17l8.6-5.4L22 13l-10 6-10-6z"/></svg></button>
  <div id="layers" class="layers">
    <label class="row">Base
      <select id="t-base"><option value="sat">Satellite</option><option value="map">Street map</option></select></label>
    <label class="row"><input id="t-plan" type="checkbox" checked> Master plan</label>
    <label class="row slider">Plan opacity <input id="op" type="range" min="0" max="1" step="0.05" value="0.82"></label>
    <label class="row"><input id="t-pano" type="checkbox" checked> 360° view points</label>
    <label class="row"><input id="t-labels" type="checkbox" checked> Road &amp; place names</label>
  </div>
</div>

<aside id="calib" class="calib" hidden></aside>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-bar"><span id="viewer-title">Street view</span><button id="viewer-close" class="icon" aria-label="Close street view">&times;</button></div>
  <div id="viewer-body" class="viewer-body"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="js/georef.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
